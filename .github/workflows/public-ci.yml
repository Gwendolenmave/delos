name: public-ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck --silent
      - name: Build, test, and scan
        run: npm test --silent
      - name: Failure summary
        if: failure()
        run: |
          echo "Public CI failed. Re-run locally with: npm ci --ignore-scripts && npm test" >&2
          exit 0
